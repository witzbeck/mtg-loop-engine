name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Run pytest (with ≥90% coverage)
        run: uv run pytest

      - name: Check documentation hygiene
        run: uv run python scripts/check_docs.py

      - name: Check STATUS.md matches frozen baselines
        run: uv run python scripts/render_status.py --check
