[project]
name = "mtg-loop-engine"
version = "0.1.0"
description = "Explainable two-card MTG loop discovery: compile, verify, and prove repeatable interactions."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[project.scripts]
mtg-loop-engine = "mtg_loop_engine.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
eval = [
    "streamlit>=1.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Mechanical preferences: fail on unknown markers/config; treat warnings as
# errors so silent deprecations cannot hide contract drift. Policy for *what*
# to test (critical path, ban useless tests) lives in CONTRIBUTING.md,
# tests/README.md, and .cursor/rules/test-quality.mdc — not in coverage %.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
xfail_strict = true
filterwarnings = [
    "error",
]
markers = [
    "slow: heavier optional checks; default CI runs the full suite without needing this mark today",
]